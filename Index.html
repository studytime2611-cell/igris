<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>IGRIS — NEET Command Center</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">I</div><div><b>IGRIS 💙</b><small>NEET COMMAND CENTER</small></div></div>
    <div class="side-label">COMMAND</div>
    <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
    <button class="nav" data-view="missions">⚔ <span>Daily Missions</span></button>
    <button class="nav" data-view="subjects">▤ <span>Subject HQ</span></button>
    <button class="nav" data-view="focus">◷ <span>Focus Room</span></button>
    <button class="nav" data-view="practice">🩺 <span>Practice &amp; Quiz</span></button>
    <button class="nav" data-view="mistakes">✧ <span>Mistake Hunter</span></button>
    <button class="nav" data-view="revision">↻ <span>Revision Log</span></button>
    <button class="nav" data-view="tests">▥ <span>Mock Tests</span></button>
    <button class="nav" data-view="vault">🗂 <span>Study Vault</span></button>
    <button class="nav" data-view="aitutor">✦ <span>AI Tutor</span></button>
    <button class="nav" data-view="analytics">📈 <span>Analytics</span></button>
    <div class="sidebar-bottom"><div class="system-status"><span class="pulse"></span> LOCAL SYSTEM ONLINE</div><small>𓆩⚔️𓆪 IGRIS 💙 • NEET 2027</small></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
      <div><div class="eyebrow" id="todayLabel">YOUR TRAINING GROUND</div><div class="top-title" id="viewTitle">Dashboard</div></div>
      <div class="top-actions">
        <span class="date-chip" id="dateChip"></span>
        <button class="icon-btn" id="zenBtn" title="Toggle Full View">⛶</button>
        <button class="icon-btn" id="importBtn" title="Import backup">⇩</button>
        <button class="icon-btn" id="exportBtn" title="Export backup">⇧</button>
      </div>
    </header>
    <section id="view" class="view"></section>
    <footer>IGRIS SYSTEM <span>•</span> Progress over perfection. Keep moving.</footer>
  </main>
</div>

<!-- Fullscreen Focus Timer Overlay -->
<div class="fs-overlay" id="timerFullscreen">
  <div class="fs-box">
    <div class="timer-state" id="fsTimerState">DEEP FOCUS</div>
    <div class="timer-flip-wrap fs-flip">
      <div class="timer-flip-unit"><div class="timer-flip-val" id="fsHrs">00</div><div class="timer-flip-lbl">HRS</div></div>
      <div class="timer-colon">:</div>
      <div class="timer-flip-unit"><div class="timer-flip-val" id="fsMins">25</div><div class="timer-flip-lbl">MINS</div></div>
      <div class="timer-colon">:</div>
      <div class="timer-flip-unit"><div class="timer-flip-val" id="fsSecs">00</div><div class="timer-flip-lbl">SECS</div></div>
    </div>
    <div class="actions" style="justify-content:center;margin-top:20px">
      <button type="button" class="btn" id="fsStartBtn" onclick="document.getElementById('startTimer')?.click()">Start focus</button>
      <button type="button" class="btn secondary" onclick="resetCurrentTimer()">Reset</button>
      <button type="button" class="btn ghost" onclick="toggleTimerFullscreen(false)">Exit Full Display</button>
    </div>
  </div>
</div>

<!-- File Preview Modal -->
<div class="modal-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
  <div class="modal-card">
    <div class="modal-head">
      <b id="previewTitle">Preview</b>
      <button type="button" class="icon-btn" onclick="closePreview()">×</button>
    </div>
    <div class="modal-body" id="previewBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
